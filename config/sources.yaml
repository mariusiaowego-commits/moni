sources:
- source_name: 36kr_rss
  type: rss
  feed_url: https://36kr.com/feed
  fetch_interval_min: 15
  enabled: true
  crawler_type: rss
- source_name: 36kr_newsflash
  type: html
  feed_url: https://36kr.com/newsflashes
  fetch_interval_min: 5
  enabled: true
  crawler_type: rss
- source_name: mpaypass
  type: html
  feed_url: https://mpaypass.com.cn/
  fetch_interval_min: 30
  enabled: true
  crawler_type: rss
- source_name: qbitai
  type: html
  feed_url: https://www.qbitai.com/
  fetch_interval_min: 30
  enabled: true
  crawler_type: rss
# WeChatRSS 真实 endpoint 来自 .env 的 WECHAT_RSS_TOKEN
# (URL 在运行时由 moni/fetch/sources/wechat_rss.py 拼接)
- source_name: wechat_rss
  type: rss
  feed_url: https://wechatrss.waytomaster.com/api/rss/all  # token 由 .env 提供
  fetch_interval_min: 60
  enabled: true
  crawler_type: rss
