# moni/cron schedule config
#
# All sources: 5min interval (user decision, 2026-06-15)
# Jobs:
#   - fetch_all_sources: 所有 enabled 源按 interval 抓取
#   - predict_tags_pending: LLM 自动给无 tag 文章打标签

jobs:
  # ── 全量抓取 (统一入口, 按 per-source interval 调度) ──
  - id: fetch_all_sources
    name: "抓取所有源"
    trigger_type: interval
    minutes: 5
    func_path: moni.cron.jobs:fetch_all_sources

  # ── LLM 自动打标签 ──
  - id: predict_tags_pending
    name: "LLM 自动打标签"
    trigger_type: interval
    minutes: 30
    func_path: moni.cron.jobs:predict_tags_pending
    func_kwargs:
      batch_size: 10
