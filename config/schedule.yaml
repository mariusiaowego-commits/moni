# moni/cron schedule config
#
# Jobs:
#   - fetch_all_sources: 每工作日 9:10 AM 抓取所有源
#     周一自动补抓周末 (周六+周日) 数据
#     抓取成功且本轮有新增时，链式触发 predict_tags_pending（不再单独定时）

jobs:
  # ── 全量抓取 ──
  - id: fetch_all_sources
    name: "抓取所有源"
    trigger_type: cron
    hour: 9
    minute: 10
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:fetch_all_sources

  # ── 行业事件日历抽取 (每天 4 个时段) ──
  - id: extract_events_morning
    name: "行业事件抽取-早间"
    trigger_type: cron
    hour: 7
    minute: 0
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20

  - id: extract_events_am
    name: "行业事件抽取-上午"
    trigger_type: cron
    hour: 8
    minute: 30
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20

  - id: extract_events_noon
    name: "行业事件抽取-午间"
    trigger_type: cron
    hour: 12
    minute: 0
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20

  - id: extract_events_evening
    name: "行业事件抽取-傍晚"
    trigger_type: cron
    hour: 18
    minute: 0
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20

  # ── 同业案例抽取 (每天一次, 默认暂停; 前端「立即抽取」按需触发) ──
  - id: extract_cases_noon_post
    name: "同业案例抽取-午后"
    trigger_type: cron
    hour: 13
    minute: 30
    day_of_week: "*"
    func_path: moni.cron.jobs:extract_cases_pending
    is_active: false
    func_kwargs:
      batch_size: 12

  # 手动演示任务：不在调度器注册，仅供案例库页「立即抽取」按钮入队
  - id: extract_cases_demo
    name: "案例抽取-立即演示"
    trigger_type: manual
    hour: 0
    minute: 0
    day_of_week: "*"
    func_path: moni.cron.jobs:extract_cases_demo
    is_active: false
    func_kwargs:
      batch_size: 10
