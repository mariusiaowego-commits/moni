# moni/cron schedule config
#
# Jobs:
#   - fetch_all_sources: 每工作日 9:10 AM 抓取所有源
#     周一自动补抓周末 (周六+周日) 数据
#   - predict_tags_pending: 每工作日 9:25 AM LLM 自动打标签

jobs:
  # ── 全量抓取 ──
  - id: fetch_all_sources
    name: "抓取所有源"
    trigger_type: cron
    hour: 9
    minute: 10
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:fetch_all_sources

  # ── LLM 自动打标签 (抓取后 15min) ──
  - id: predict_tags_pending
    name: "LLM 自动打标签"
    trigger_type: cron
    hour: 9
    minute: 25
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:predict_tags_pending
    func_kwargs:
      batch_size: 10

  # ── 行业事件日历抽取 (每天 4 个时段) ──
  - id: extract_events_morning
    name: "行业事件抽取-早间"
    trigger_type: cron
    hour: 7
    minute: 0
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20

  - id: extract_events_am
    name: "行业事件抽取-上午"
    trigger_type: cron
    hour: 8
    minute: 30
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20

  - id: extract_events_noon
    name: "行业事件抽取-午间"
    trigger_type: cron
    hour: 12
    minute: 0
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20

  - id: extract_events_evening
    name: "行业事件抽取-傍晚"
    trigger_type: cron
    hour: 18
    minute: 0
    day_of_week: "mon-fri"
    func_path: moni.cron.jobs:extract_events_pending
    func_kwargs:
      batch_size: 20
