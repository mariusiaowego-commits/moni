# moni/cron schedule config — PRD §4.6
#
# Job types:
#   interval : run every N seconds/minutes/hours/days
#   cron     : run at specific cron-style times
#
# func_path format: "module.submodule:function_name"
#   module.submodule is dot-separated, function_name is after ":"
#   e.g. "moni.fetch:fetch_all"
#
# func_args / func_kwargs are passed to the function when called.
#
# For interval triggers: at least one of seconds/minutes/hours/days/weeks is required.
# For cron triggers: minute/hour/day/month/day_of_week standard cron fields.

jobs:
  # ── News source fetch jobs ──────────────────────────────────────────────

  - id: fetch_36kr_rss
    name: "Fetch 36氪 RSS"
    trigger_type: interval
    minutes: 15
    func_path: moni.fetch:run
    func_kwargs:
      source_name: "36kr_rss"

  - id: fetch_mpaypass
    name: "Fetch 移动支付网"
    trigger_type: interval
    minutes: 30
    func_path: moni.fetch:run
    func_kwargs:
      source_name: "mpaypass"

  - id: fetch_qbitai
    name: "Fetch 量子位"
    trigger_type: interval
    minutes: 30
    func_path: moni.fetch:run
    func_kwargs:
      source_name: "qbitai"

  - id: fetch_wechat_rss
    name: "Fetch 微信公众号RSS"
    trigger_type: interval
    minutes: 60
    func_path: moni.fetch:run
    func_kwargs:
      source_name: "wechat_rss"
