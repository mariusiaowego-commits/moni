# 事实核查交叉验证域名分档（v1.0.100）
#
# tier_a  一手来源：1 个即可作为权威支撑
# tier_a_brand  业务方/主办方官方页：只对其自身公告算一手
# tier_b  编辑制媒体：计独立域，但需要凑够数量
# tier_c  不计入（显式列出只为报表可读；未收录域名同样按不计处理）
#
# 判定：≥2 个不同注册域且 ≥1 个 tier_a，或 ≥3 个不同 tier_b 且口径一致。
# 注册域按 eTLD+1 计算，weixin.qq.com 与 news.qq.com 视作同一个 qq.com，
# 避免同一集团的多个页面被当成独立来源。
#
# 维护：每月跑 `moni fact-check-domains --report` 出未收录域名 Top 20，
# 出现 ≥2 次的进人工定级队列。不自动收录。

