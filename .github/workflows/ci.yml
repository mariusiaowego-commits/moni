name: ci

# v1.0.48 — moni 的第一条 CI。
#
# 之前所有测试都靠本地手跑, 于是"基线漂了"只能靠人发现 (v1.0.46 审计
# 一口气找出 3 处跨模块测试污染: 8 个测试其实早就在假绿)。
# CI 跑在 GitHub 的机器上, 不消耗本地 token, 每次 push / PR 自动跑。
#
# 为什么只测 3.12: AGENTS.md 明确全项目统一 Python 3.12 (系统 3.14 缺
# yaml 依赖 → routes 全部不注册 → POST /run 返 405)。
# pyproject 里写的是 >=3.11 (保持安装约束由 dad 拍板, 不擅改), 但 3.11 没有
# 被任何一条项目文档支持过, 生产与 CI 均锁定 Python 3.12。
#
# v1.0.55 (CI 变绿治理):
# 1. worker.py 解释器路径动态使用 sys.executable, 消除 /usr/local/bin/python3
#    硬编码在 GitHub runner 上的 ENOENT。
# 2. test_36kr_browser.py 改造为 hermetic 测试, 摆脱对宿主机 Playwright 缓存的
#    强依赖。
# 3. pyproject.toml dev 依赖补充 pillow>=10, 满足前端 safe_href 生成测试需求。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# v1.0.51 (audit fix): 默认 token 权限是"仓库内全部读写", 对一条只跑
# pytest 的流水线来说过宽。收紧成只读。
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest · py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # 流水线只需要读代码, 不需要用 checkout 留下的 token 回头推
          # 东西。不落盘 = 少一个凭据泄露面。
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"
          cache: pip
          # 依赖声明在 pyproject.toml 里 (不是 requirements.txt),
          # 不显式指定的话 setup-python 找不到依赖文件, 缓存会静默失效。
          cache-dependency-path: pyproject.toml

      - name: Install moni + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Check the package imports cleanly
        # editable install 装错根目录时 pytest 照样能跑 (它从 cwd import),
        # 但生产跑的是 site-packages 里那份 —— 装错根目录是 moni 历史踩过
        # 的坑 (AGENTS.md「Editable install 踩坑」), 所以单独验一次。
        #
        # v1.0.51 (audit fix): 之前在仓库根目录执行, 而仓库根目录里正好
        # 有一个 `moni/` 包目录 —— Python 会优先从 cwd 导入, 于是这条检查
        # **永远绿**, 哪怕 editable install 装错了根目录。挪到仓库外执行,
        # 才真的验到 site-packages 里那一份。
        run: |
          cd "$RUNNER_TEMP"
          python -c "import moni, moni.web.server, moni.cron.jobs; print(moni.__file__)"

      - name: Run the test suite
        # -p no:cacheprovider: 3.12 上 pytest 的 cacheprovider 会 segfault
        # (sprint-07/08/09 连续踩过三次), 沿用项目惯例关掉。
        # HOME 必须可写 —— 分享队列的测试会往 ~/.moni/queue 写 manifest。
        #
        # v1.0.51 (audit fix): tee 一份日志, 失败时上传 —— 比只看
        # "Process completed with exit code 1" 有用得多。
        run: |
          set -o pipefail
          python -m pytest tests/ -q -p no:cacheprovider 2>&1 | tee pytest-ci.log

      - name: Upload the pytest log if the suite failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.1
        with:
          name: pytest-log
          path: pytest-ci.log
          if-no-files-found: ignore
          retention-days: 7
