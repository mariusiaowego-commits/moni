[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "moni"
version = "0.1.0"
description = "同业信源自动抓取与本地新闻库"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10.0",
    "pyyaml>=6.0",
]

[project.scripts]
moni = "moni.cli.main:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["moni*"]
exclude = ["wt*", "wt.*", ".pending*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
