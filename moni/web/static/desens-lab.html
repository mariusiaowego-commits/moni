<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脱敏实验室 · moni</title>
<style>
  /* v1.0.132: 与主站同一套主题令牌（浅色 / .dark 两档），不再自带一套配色。
     自定义主题由下方 bootstrap 从 localStorage 注入（与 js/theme.js 同键）。 */
  :root {
    --radius: 0.375rem;
    --background: oklch(0.963 0.013 97.4);
    --foreground: oklch(0.218 0.000 89.9);
    --card: oklch(0.996 0.007 97.3);
    --card-fg: oklch(0.218 0.000 89.9);
    --muted: oklch(0.928 0.034 84.6);
    --muted-fg: oklch(0.486 0.040 87.0);
    --accent: oklch(0.819 0.109 302.2);
    --accent-fg: oklch(0.218 0.000 89.9);
    --destructive: oklch(0.542 0.208 19.5);
    --destructive-fg: oklch(0.963 0.013 97.4);
    --border: oklch(0.848 0.030 75.6);
    --input: oklch(0.848 0.030 75.6);
    --success: oklch(0.48 0.12 150);
    --success-fg: oklch(0.99 0.01 150);
    --success-muted: oklch(0.92 0.05 150);
    --success-muted-fg: oklch(0.32 0.08 150);
    --warning: oklch(0.72 0.14 75);
    --warning-fg: oklch(0.25 0.06 75);
    --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-12: 12px;
    --font-13: 13px;
    --font-14: 14px;
    --font-18: 18px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  .dark {
    --background: oklch(0.170 0.004 164.5);
    --foreground: oklch(0.928 0.034 84.6);
    --card: oklch(0.218 0.000 89.9);
    --card-fg: oklch(0.928 0.034 84.6);
    --muted: oklch(0.257 0.030 61.5);
    --muted-fg: oklch(0.633 0.000 89.9);
    --accent: oklch(0.819 0.109 302.2);
    --accent-fg: oklch(0.170 0.004 164.5);
    --destructive: oklch(0.542 0.208 19.5);
    --destructive-fg: oklch(0.928 0.034 84.6);
    --border: oklch(0.337 0.007 84.6);
    --input: oklch(0.337 0.007 84.6);
    --success: oklch(0.70 0.14 150);
    --success-fg: oklch(0.15 0.03 150);
    --success-muted: oklch(0.28 0.05 150);
    --success-muted-fg: oklch(0.85 0.08 150);
    --warning: oklch(0.78 0.12 80);
    --warning-fg: oklch(0.18 0.04 80);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--background); color: var(--foreground);
    font: var(--font-14)/1.6 var(--font);
    -webkit-font-smoothing: antialiased;
    transition: background 0.3s, color 0.3s;
  }
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 24px; border-bottom: 1px solid var(--border); background: var(--card);
  }
  h1 { font-size: var(--font-18); margin: 0; font-weight: 600; letter-spacing: .2px; }
  .sub { color: var(--muted-fg); font-size: var(--font-13); }
  .back {
    color: var(--muted-fg); text-decoration: none; font-size: var(--font-13);
    padding: 5px 10px; border: 1px solid var(--border); border-radius: var(--radius);
  }
  .back:hover { background: var(--muted); color: var(--foreground); }
  .spacer { flex: 1; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--border); background: var(--muted); color: var(--muted-fg);
  }
  .pill.on { color: var(--success-muted-fg); background: var(--success-muted); border-color: var(--success-muted); }
  .pill.off { color: var(--muted-fg); }
  #labPanels { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  main { padding: 20px 24px 40px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
  .panel > h2 {
    margin: 0; padding: 12px 16px; font-size: 13px; font-weight: 600;
    color: var(--muted-fg); border-bottom: 1px solid var(--border);
  }
  .pad { padding: 16px; }
  textarea {
    width: 100%; min-height: 108px; resize: vertical;
    background: var(--background); color: var(--foreground); border: 1px solid var(--input);
    border-radius: 8px; padding: 12px; font-family: var(--mono); font-size: 13px;
  }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  button {
    background: var(--card); color: var(--card-fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 14px; font-size: 13px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
  }
  button:hover { background: var(--muted); border-color: var(--accent); }
  button:active { transform: scale(0.98); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button:disabled { opacity: .5; cursor: progress; }
  select {
    background: var(--card); color: var(--card-fg); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px;
  }
  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; min-width: 0; }
  @media (max-width: 1200px) { .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 820px) { .cols { grid-template-columns: minmax(0, 1fr); } }
  .col { min-width: 0; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; }
  .col h3 {
    margin: 0; padding: 10px 14px; font-size: 12px; font-weight: 600; color: var(--muted-fg);
    border-bottom: 1px solid var(--border); background: var(--muted);
  }
  .col h3 .n {
    color: var(--accent-fg); background: var(--accent); border-radius: 999px;
    padding: 1px 7px; margin-right: 6px; font-size: 11px;
  }
  .col pre {
    margin: 0; padding: 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; min-height: 220px; max-height: 420px; overflow: auto;
  }
  .col.masked h3 { color: var(--warning-fg); }
  .col.raw h3 { color: var(--warning-fg); }
  .col.restored h3 { color: var(--success-muted-fg); }
  .metrics { display: flex; flex-wrap: wrap; gap: 10px; }
  .metric { background: var(--muted); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 132px; }
  .metric .k { color: var(--muted-fg); font-size: 11.5px; }
  .metric .v { font-family: var(--mono); font-size: 19px; margin-top: 2px; }
  .metric.good .v { color: var(--success); }
  .metric.bad .v { color: var(--destructive); }
  #ledger { overflow-x: auto; }
  #ledger .recent { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; }
  #ledger .recent h3 { margin: 0 0 6px; font-size: 12px; font-weight: 600; color: var(--muted-fg); }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted-fg); font-weight: 500; white-space: nowrap; }
  /* v1.0.132: 数字列表头与单元格统一右对齐（此前只有 td 右对齐，表头仍靠左） */
  th.num, td.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.num { font-family: var(--mono); }
  pre.sql { margin: 0; padding: 12px 14px; font-family: var(--mono); font-size: 12px; color: var(--muted-fg); white-space: pre-wrap; }
  .err { color: var(--destructive); font-size: 13px; margin-top: 10px; }
  .tag { color: var(--accent); }
</style>
<script>
/* v1.0.132: 复用主站主题（与 js/theme.js 相同存储键）；读不到就用上面的默认令牌。 */
(function () {
  try {
    var dark = localStorage.getItem('moni-dark-mode') === 'true';
    var active = localStorage.getItem('moni-active-theme');
    var custom = JSON.parse(localStorage.getItem('moni-themes') || '[]');
    var theme = (custom || []).find(function (t) { return t && t.name === active; });
    if (dark) document.documentElement.classList.add('dark');
    if (!theme) return;
    var vars = dark ? theme.dark : theme.light;
    if (!vars) return;
    var css = ':root{';
    Object.keys(vars).forEach(function (k) { css += k + ':' + vars[k] + ';'; });
    css += '}';
    var el = document.createElement('style');
    el.id = 'theme-override';
    el.textContent = css;
    document.head.appendChild(el);
  } catch (e) { /* 主题读不到就用默认令牌 */ }
})();
</script>
</head>
<body>
<header>
  <a class="back" href="/" title="返回 moni 主界面">← 主站</a>
  <h1 title="验证发给模型的内容遮蔽与本地还原效果">脱敏实验室</h1>
  <span class="sub" title="发给模型的内容先在本机遮蔽敏感信息，收到模型回包后再在本机还原">出站遮蔽，入站本地还原</span>
  <span class="spacer"></span>
  <span class="pill" id="switchState" title="L1 凭据 / L2 个人信息 / L3 基础设施">脱敏 …</span>
  <span class="pill" id="ledgerState" title="账本累计记录：生产调用与实验室调用次数">账本 …</span>
  <a class="back" href="/config?tab=desens" title="前往配置管理调整脱敏开关与规则">脱敏配置 →</a>
</header>

<main>
  <div id="labPanels">
  <section class="panel">
    <h2 title="输入待测试文本并选择策略，验证遮蔽与本地还原链路">测试输入</h2>
    <div class="pad">
      <textarea id="input" spellcheck="false"></textarea>
      <div class="row">
        <button id="sample" title="填入包含机构名、手机号与邮箱的测试文本">载入示例</button>
        <select id="taskType" title="选择脱敏策略：standard 遮蔽全部已启用类别；fact_check_plus 保留公开机构名">
          <option value="standard">标准策略 (standard)</option>
          <option value="fact_check_plus">联网核查 (fact_check_plus)</option>
        </select>
        <input id="terms" placeholder="临时遮蔽词（逗号分隔）"
               title="仅本次测试生效的临时遮蔽词，多个词用逗号分隔" spellcheck="false"
               style="flex:1;min-width:220px;background:var(--background);color:var(--foreground);
                      border:1px solid var(--input);border-radius:8px;padding:7px 10px;
                      font-family:var(--mono);font-size:13px;">
        <button id="preview" title="仅在本机执行遮蔽检查，不调用大模型">本地预览</button>
        <button id="run" class="primary" title="将遮蔽后的内容发往大模型并验证本地还原效果">模型实测</button>
        <span class="sub" id="status"></span>
      </div>
      <div class="err" id="err"></div>
    </div>
  </section>

  <section class="cols">
    <div class="col"><h3 title="未做任何处理的原始输入文本"><span class="n">①</span>原文</h3><pre id="c1">—</pre></div>
    <div class="col masked"><h3 title="已完成本机遮蔽，实际发往大模型的出站内容"><span class="n">②</span>发给模型的内容</h3><pre id="c2">—</pre></div>
    <div class="col raw"><h3 title="大模型返回的原始文本，仍包含脱敏占位符"><span class="n">③</span>模型回包</h3><pre id="c3">—</pre></div>
    <div class="col restored"><h3 title="经本机映射表还原占位符后的最终文本"><span class="n">④</span>本地还原后</h3><pre id="c4">—</pre></div>
  </section>

  <section class="panel">
    <h2>本次指标</h2>
    <div class="pad metrics" id="metrics"></div>
  </section>

  <section class="panel">
    <h2 title="仅记录脱敏元数据与计数，不落盘任何敏感原文；生产统计已排除实验室调用">审计账本</h2>
    <div class="pad" id="ledger"></div>
    <pre class="sql" id="sql" title="生产口径复算 SQL（已排除 desens_lab 调用）"></pre>
  </section>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const DEFAULT_TERMS = "招商银行, 兴业银行";
const SAMPLE = [
  "招商银行与兴业银行同日发布公告：招商银行客服电话 13800138000，",
  "联系人邮箱 analyst@bankcorp.cn。",
  "请只复述上述联系方式，不要展开分析。"
].join("\n");

const SQL_TEXT = "SELECT count(*) AS calls, sum(masked_total) AS masked_total,\n"
  + "       sum(restored_total) AS restored_total, sum(unrestored_count) AS unrestored_count,\n"
  + "       sum(leak_scan_hits) AS leak_scan_hits, sum(residual_placeholders) AS residual_placeholders\n"
  + "FROM desensitize_events WHERE call_site != 'desens_lab';";

function setStatus(text) { $("status").textContent = text || ""; }
function extraTerms() {
  return $("terms").value.split(/[,，、\s]+/).map((t) => t.trim()).filter(Boolean);
}
function setErr(text) { $("err").textContent = text || ""; }

function metric(k, v, cls) {
  return '<div class="metric ' + (cls || "") + '"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>";
}

function renderMetrics(s) {
  if (!s) { $("metrics").innerHTML = '<span class="sub">待运行</span>'; return; }
  const leak = s.leak_scan_hits, unrest = s.unrestored_count, resid = s.residual_placeholders;
  $("metrics").innerHTML = [
    metric("遮蔽数", s.masked_total),
    metric("还原数", s.restored_total, "good"),
    metric("未还原", unrest, unrest === 0 ? "good" : "bad"),
    metric("泄漏命中", leak, leak === 0 ? "good" : "bad"),
    metric("残留符", resid, resid === 0 ? "good" : "bad"),
    metric("遮蔽耗时", s.mask_latency_us + " µs"),
    metric("还原耗时", s.restore_latency_us + " µs"),
    metric("模型耗时", s.model_duration_ms + " ms"),
  ].join("");
}

async function loadStats() {
  const res = await fetch("/api/desensitize/stats");
  if (!res.ok) throw new Error("stats " + res.status);
  const d = await res.json();
  const pill = $("switchState");
  const mark = (v) => (v ? "✓" : "✗");
  pill.textContent = "脱敏 " + (d.enabled ? "开" : "关") + " · L1" + mark(d.levels.level_l1) +
    " L2" + mark(d.levels.level_l2) + " L3" + mark(d.levels.level_l3);
  pill.className = "pill " + (d.enabled ? "on" : "off");
  const t = d.totals, lab = d.lab_totals;
  $("ledgerState").textContent = "账本 生产 " + t.calls + " · 实验 " + lab.calls;
  $("ledger").innerHTML =
    "<table><thead><tr><th>统计口径</th><th class='num'>调用数</th><th class='num'>遮蔽数</th>"
    + "<th class='num'>还原数</th><th class='num'>未还原</th><th class='num'>泄漏数</th>"
    + "<th class='num'>残留数</th><th class='num'>拦截数</th><th class='num'>还原率</th></tr></thead><tbody>"
    + row("生产环境", t) + row("实验室", lab)
    + "</tbody></table>";
  renderRecent(d.recent || []);
  $("sql").textContent = SQL_TEXT;
}

function row(label, t) {
  return "<tr><td>" + label + "</td><td class='num'>" + t.calls + "</td><td class='num'>" + t.masked_total
    + "</td><td class='num'>" + t.restored_total + "</td><td class='num'>" + t.unrestored_count
    + "</td><td class='num'>" + t.leak_scan_hits + "</td><td class='num'>" + t.residual_placeholders
    + "</td><td class='num'>" + (t.blocked_calls || 0)
    + "</td><td class='num'>"
    + (t.restore_success_rate === null || t.restore_success_rate === undefined
        ? "—" : (t.restore_success_rate * 100).toFixed(1) + "%")
    + "</td></tr>";
}


// 账本最近记录走 DOM API + textContent：服务端字段不拼进 innerHTML。
function renderRecent(recent) {
  if (!recent.length) return;
  const wrap = document.createElement("div");
  wrap.className = "recent";
  const title = document.createElement("h3");
  title.textContent = "近期记录";
  wrap.appendChild(title);
  const table = document.createElement("table");
  table.innerHTML = "<thead><tr><th>调用点</th><th>任务类型</th>"
    + "<th class='num'>遮蔽</th><th class='num'>还原</th><th class='num'>未还原</th>"
    + "<th class='num'>泄漏</th><th>状态</th><th>时间</th></tr></thead>";
  const tbody = document.createElement("tbody");
  for (const r of recent) {
    const tr = document.createElement("tr");
    for (const v of [r.call_site, r.task_type]) {
      const td = document.createElement("td");
      td.textContent = v === null || v === undefined ? "" : String(v);
      tr.appendChild(td);
    }
    for (const v of [r.masked_total, r.restored_total, r.unrestored_count, r.leak_scan_hits]) {
      const td = document.createElement("td");
      td.className = "num";
      td.textContent = String(v === null || v === undefined ? 0 : v);
      tr.appendChild(td);
    }
    const tdOutcome = document.createElement("td");
    tdOutcome.textContent = r.blocked ? "已拦截" : (r.fallback_used || "正常");
    tr.appendChild(tdOutcome);
    const tdTime = document.createElement("td");
    tdTime.textContent = r.created_at || "";
    tr.appendChild(tdTime);
    tbody.appendChild(tr);
  }
  table.appendChild(tbody);
  wrap.appendChild(table);
  $("ledger").appendChild(wrap);
}

async function preview() {
  setErr(""); setStatus("本地预览中…"); $("err").title = "";
  const res = await fetch("/api/desensitize/preview", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      text: $("input").value, task_type: $("taskType").value, extra_terms: extraTerms(),
    }),
  });
  const d = await res.json();
  if (!res.ok) { setErr(d.message || d.detail || "预览失败"); setStatus(""); return; }
  $("c1").textContent = $("input").value;
  $("c2").textContent = d.masked_text;
  $("c3").textContent = "—";
  $("c4").textContent = "—";
  renderMetrics(null);
  if (d.blocked) {
    setErr("已拦截：" + (d.blocked_reason || "blocked"));
    $("err").title = "命中拦截规则或出站泄漏扫描，即使点击模型实测也不会发往大模型";
    setStatus("已拦截 · 遮蔽 " + d.masked_total + " · " + d.policy_mode);
    return;
  }
  setStatus("遮蔽 " + d.masked_total + " · " + d.policy_mode + " · " + d.latency_us + " µs");
}

async function run() {
  setErr(""); $("err").title = ""; setStatus("模型调用中…");
  $("status").title = "正在请求大模型并执行本地还原，通常耗时 5–15 秒";
  $("run").disabled = true; $("preview").disabled = true;
  try {
    const res = await fetch("/api/desensitize/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        text: $("input").value, task_type: $("taskType").value, extra_terms: extraTerms(),
      }),
    });
    const d = await res.json();
    if (!res.ok) { setErr(d.message || d.detail || "调用失败"); setStatus(""); return; }
    $("c1").textContent = d.original;
    $("c2").textContent = d.masked;
    $("c3").textContent = d.reply_raw;
    $("c4").textContent = d.restored;
    renderMetrics(d.stats);
    setStatus("完成 · " + d.policy_mode
      + (d.fallback_used ? " · 回退：" + d.fallback_used : ""));
    await loadStats();
  } catch (e) {
    setErr(String(e));
    setStatus("");
  } finally {
    $("run").disabled = false; $("preview").disabled = false;
  }
}

$("sample").onclick = () => { $("input").value = SAMPLE; $("terms").value = DEFAULT_TERMS; };
$("preview").onclick = preview;
$("run").onclick = run;
$("input").value = SAMPLE;
$("terms").value = DEFAULT_TERMS;
$("sql").textContent = SQL_TEXT;
loadStats().catch(() => {});
</script>
</body>
</html>
