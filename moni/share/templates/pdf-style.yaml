# PDF 日报版式配置
# 修改此文件即可调整 PDF 外观，无需改代码

# 页面设置
page:
  size: A4
  margin_top: 2cm
  margin_bottom: 2cm
  margin_left: 2cm
  margin_right: 2cm

# 颜色方案
colors:
  primary: "#1a365d"      # 深蓝（标题区背景、文章标题）
  accent: "#d97706"       # 橙色（序号、强调）
  accent_light: "#fef3c7" # 浅橙（日期文字）
  text: "#2a3447"         # 深灰（正文）
  muted: "#6b7280"        # 辅助灰（来源、tag）
  border: "#e5e1d8"       # 边框
  tag_bg: "#f3f4f6"       # tag 背景
  light_bg: "#f7f4ee"     # 浅米色背景

# 标题区
header:
  bg_color: primary       # 引用 colors 中的颜色
  title_font_size: 28
  title_color: "#ffffff"
  date_font_size: 14
  date_color: accent_light
  padding_top: 30
  padding_bottom: 25

# 文章样式
article:
  # 序号
  number_font_size: 32
  number_color: accent
  
  # 标题
  title_font_size: 18
  title_color: primary
  title_space_after: 6
  
  # 来源
  source_font_size: 10
  source_color: muted
  
  # 正文
  body_font_size: 11
  body_line_height: 18
  body_color: text
  
  # 区块标题（AI 摘要、事实核查）
  section_label_color: accent
  section_label_prefix: "▎"  # 竖线装饰

# Tag 标签
tag:
  font_size: 9
  text_color: muted
  bg_color: tag_bg
  padding: 3
  radius: 3              # 圆角
  max_display: 6          # 最多显示几个

# 列表
list:
  bullet: "•"
  indent: 15
  space_after: 4

# 引用块
quote:
  border_color: accent
  border_width: 3
  indent: 20
  text_color: muted

# 分隔线
divider:
  color: border
  thickness: 0.5
  space_before: 15
  space_after: 15
